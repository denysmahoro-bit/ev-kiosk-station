<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Sela Volts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="portal-page">
    <header class="topbar">
      <div>
        <h1>Sela Volts</h1>
        <p>Dashboard</p>
      </div>
      <a class="topbar-link" href="/">Portal selection</a>
    </header>

    <section class="dashboard panel">
      <h2>Station dashboard</h2>
      <div id="dashboard-summary" class="summary-grid"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Plate</th>
              <th>Vehicle</th>
              <th>Seller</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sessions-table"></tbody>
        </table>
      </div>
    </section>
    <section class="dashboard panel">
      <h2>Seller accounts</h2>
      <form id="worker-form" class="inline-form">
        <input id="worker-name" placeholder="Name" required />
        <input id="worker-username" placeholder="Username" required />
        <input id="worker-password" type="password" placeholder="Temporary password (8+ chars)" minlength="8" required />
        <button type="submit">Create seller</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Status</th><th>Actions</th></tr></thead><tbody id="workers-table"></tbody></table></div>
    </section>

    <script>
      async function fetchJson(url) {
        const response = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        return data;
      }

      async function loadDashboard() {
        const stats = await fetchJson('/api/dashboard');
        document.getElementById('dashboard-summary').innerHTML = `
          <div class="summary-card"><h3>Customers</h3><p>${stats.totalCustomers}</p></div>
          <div class="summary-card"><h3>Vehicles</h3><p>${stats.totalVehicles}</p></div>
          <div class="summary-card"><h3>Sessions</h3><p>${stats.totalSessions}</p></div>
          <div class="summary-card"><h3>Revenue</h3><p>${stats.totalRevenue} RWF</p></div>
        `;

        document.getElementById('sessions-table').innerHTML = (stats.sessions || [])
          .slice()
          .reverse()
          .map((session) => `
            <tr>
              <td>${session.plate_number}</td>
              <td>${session.vehicle_type || 'Vehicle'}</td>
              <td>${session.seller_name || 'Seller'}</td>
              <td>${session.amount_due || session.amount || 0} RWF</td>
              <td><span class="status-badge ${session.status}">${session.status}</span></td>
            </tr>
          `)
          .join('');
        const workers = await fetchJson('/api/workers');
        document.getElementById('workers-table').innerHTML = workers.map((worker) => `
          <tr><td>${worker.name}</td><td>${worker.username}</td><td>${worker.approved ? 'Approved' : 'Pending'}</td>
          <td><button data-action="approve" data-id="${worker.id}" ${worker.approved ? 'disabled' : ''}>Approve</button>
          <button data-action="reset" data-id="${worker.id}">Reset password</button>
          <button data-action="delete" data-id="${worker.id}">Delete</button></td></tr>`).join('');
      }

      document.getElementById('worker-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/api/workers', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: document.getElementById('worker-name').value, username: document.getElementById('worker-username').value, password: document.getElementById('worker-password').value }) });
        const result = await response.json(); if (!response.ok) return alert(result.error);
        event.target.reset(); loadDashboard().catch((error) => alert(error.message));
      });
      document.getElementById('workers-table').addEventListener('click', async (event) => {
        const button = event.target.closest('button'); if (!button) return;
        const id = button.dataset.id;
        if (button.dataset.action === 'delete' && !confirm('Delete this seller?')) return;
        const body = button.dataset.action === 'approve' ? { approved: true } : { password: prompt('Enter a new password (8+ characters):') };
        if (button.dataset.action === 'reset' && (!body.password || body.password.length < 8)) return;
        const response = await fetch('/api/workers/' + id, { method: button.dataset.action === 'delete' ? 'DELETE' : 'PATCH', headers: {'Content-Type':'application/json'}, body: button.dataset.action === 'delete' ? undefined : JSON.stringify(body) });
        if (!response.ok) { const result = await response.json(); return alert(result.error); }
        loadDashboard().catch((error) => alert(error.message));
      });

      loadDashboard().catch((error) => {
        alert(error.message);
      });
    </script>
  </body>
</html>
