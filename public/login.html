<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff sign in | Sela Volts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="portal-page">
    <main class="container single-column">
      <section class="panel auth-panel">
        <div class="auth-header">
          <span class="brand-pill">Sela Volts staff</span>
          <h1>Sign in</h1>
          <p>Sign in to access the Seller portal and Dashboard.</p>
        </div>
        <form id="staff-login-form">
          <label>
            Username or email
            <input type="text" id="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" id="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Sign in</button>
          <a class="secondary-btn subtle auth-back-link" href="/">Back to website</a>
        </form>
        <p id="login-message" class="auth-message" role="alert"></p>
      </section>
    </main>
    <script>
      const form = document.getElementById('staff-login-form');
      const message = document.getElementById('login-message');
      const next = new URLSearchParams(window.location.search).get('next') || '/dashboard';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Sign in failed.');
          window.location.href = next.startsWith('/') ? next : '/dashboard';
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
